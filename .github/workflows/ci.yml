name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same versions as the local mise install; keep them in step.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1"
          elixir-version: "1.20.4-otp-29"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # Game files are copyrighted and never in the repo, so tests that need
      # them (MIRROR_MOM_PATH) skip here; run scripts/test_game.sh locally.
      - run: mix test
